  .prog-labels span.done{color:var(--ink-dim)}
  .prog-labels span.active{color:var(--orange)}

  .consent-box.err{border-color:#E5484D}

  .cta{width:100%;margin-top:16px;border:none;cursor:pointer;border-radius:10px;
    background:linear-gradient(180deg,var(--orange),var(--orange-press));color:#fff;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;

    box-shadow:0 8px 22px rgba(255,107,26,0.28)}

  .cta:active{transform:translateY(1px)}

  .cta svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.4}

  .back{display:block;margin:13px auto 0;background:none;border:none;color:var(--ink-faint);cursor:pointer;
    font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;padding:6px}
  .back:hover{color:var(--ink-dim)}

  /* trust */
  .trust{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px 4px;color:var(--ink-faint);
    font-size:12px}
  .trust svg{width:13px;height:13px;fill:var(--ink-faint)}
  .trust b{color:var(--ink-dim);font-weight:600}

  /* success */
  .done-screen{text-align:center;padding:22px 8px 8px;animation:enter .4s ease}
  .done-screen .badge{width:66px;height:66px;border-radius:50%;margin:0 auto 16px;background:rgba(63,185,80,0.14);

  .done-screen .badge svg{width:32px;height:32px;fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .done-screen h2{font-family:'Oswald',sans-serif;font-weight:700;font-size:25px;text-transform:uppercase;margin-bottom:8px}
  .done-screen p{font-size:14.5px;color:var(--ink-dim);line-height:1.5;max-width:340px;margin:0 auto}
  .tag{display:inline-block;margin-top:14px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>

      <div class="inp"><label>Phone</label><input id="c_phone" inputmode="tel" autocomplete="tel" placeholder="(555) 555-5555"><div class="msg" id="m_phone"></div></div>
      <div class="inp"><label>Email</label><input id="c_email" inputmode="email" autocomplete="email" placeholder="you@email.com"><div class="msg" id="m_email"></div></div>
      <div class="consent-box" id="consentBox">
        <label class="consent"><input type="checkbox" id="c_consent">
          <span>By checking here, I agree that Enhanced Wealth may share the information I provide with participating licensed insurance agencies, agents, brokers, carriers, or other insurance providers that may offer products or services matching my request. I understand that these companies may contact me by phone, text message, and email regarding insurance products and related services, including, where permitted by law, using automated technology or an artificial/prerecorded voice. My consent is not required as a condition of purchasing any product or service. Message and data rates may apply.</span></label>
      </div>
    </div>
    <button class="cta" id="submit">Get my plan <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`;
  }

  if(step>0) html += `<button class="back" id="back">← Back</button>`;

  wrap.innerHTML = html;
  stage.replaceChildren(wrap);
  wireStep(s);
  keepVideoInView();
}

function keepVideoInView(){ window.scrollTo({top:0,behavior:'smooth'}); }

function wireStep(s){
  if(step>0){ const b=document.getElementById('back'); if(b) b.onclick=()=>{ step--; render(); }; }

  if(s.type==="choice"){
    stage.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        answers[s.key]=btn.dataset.v;
        stage.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
        btn.classList.add('sel');
        setTimeout(advance,180); // brief confirm, then advance
      };
    });
  }

  if(s.type==="number"){
    const inp=document.getElementById('ageInput');
    const note=document.getElementById('ageNote');
    const next=document.getElementById('next');
    inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/[^0-9]/g,''); note.classList.remove('err'); note.textContent=s.note; inp.classList.remove('err'); });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') next.click(); });
    next.onclick=()=>{
      const n=parseInt(inp.value,10);
      if(!inp.value || isNaN(n) || n<s.min || n>s.max){
        inp.classList.add('err'); note.classList.add('err');
        note.textContent=`Enter a valid age (${s.min}–${s.max})`;
        inp.focus(); return;
      }
      answers[s.key]=String(n); advance();
    };
    setTimeout(()=>inp.focus(),260);
  }

  if(s.type==="select"){
    const selEl=document.getElementById('selInput');
    const note=document.getElementById('selNote');
    const next=document.getElementById('next');
    selEl.addEventListener('change',()=>{ selEl.classList.remove('err'); note.classList.remove('err'); note.textContent=''; });
    next.onclick=()=>{
      if(!selEl.value){ selEl.classList.add('err'); note.classList.add('err'); note.textContent='Please choose your state'; return; }
      answers[s.key]=selEl.value; advance();
    };
  }

  if(s.type==="contact"){
    const submit=document.getElementById('submit');
    const nameEl=document.getElementById('c_name'), phoneEl=document.getElementById('c_phone'),
          emailEl=document.getElementById('c_email'), consentEl=document.getElementById('c_consent');
    // light phone formatting
    phoneEl.addEventListener('input',()=>{
      let d=phoneEl.value.replace(/\D/g,'').slice(0,10); let out=d;
      if(d.length>6) out=`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
      else if(d.length>3) out=`(${d.slice(0,3)}) ${d.slice(3)}`;
      else if(d.length>0) out=`(${d}`;
      phoneEl.value=out; clearMsg(phoneEl,'m_phone');
    });
    [nameEl,emailEl].forEach(el=>el.addEventListener('input',()=>clearMsg(el,el===nameEl?'m_name':'m_email')));
    consentEl.addEventListener('change',()=>document.getElementById('consentBox').classList.remove('err'));
    submit.onclick=()=>{
      let ok=true;
      if(nameEl.value.trim().length<2){ setMsg(nameEl,'m_name','Please enter your name'); ok=false; }
      if(phoneEl.value.replace(/\D/g,'').length!==10){ setMsg(phoneEl,'m_phone','Enter a 10-digit phone'); ok=false; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)){ setMsg(emailEl,'m_email','Enter a valid email'); ok=false; }
      if(!consentEl.checked){ ok=false; document.getElementById('consentBox').classList.add('err'); }
      if(!ok) return;
      answers.name=nameEl.value.trim(); answers.phone=phoneEl.value; answers.email=emailEl.value.trim();
      finish();
    };
  }
}
function setMsg(el,id,t){ el.classList.add('err'); document.getElementById(id).textContent=t; }
function clearMsg(el,id){ el.classList.remove('err'); document.getElementById(id).textContent=''; }

function advance(){ if(step<STEPS.length-1){ step++; render(); } }

/* ---- lead scoring (phone-close model: never hard-DQ borderline) ---- */
function scoreLead(a){
  const hotBudget = a.budget==="$1,000 – $2,000" || a.budget==="$2,000 – $3,500" || a.budget==="$3,500+";
  const highIncome = a.income==="$7,500 – $10,000" || a.income==="$10,000+";
  if(hotBudget || highIncome) return "HOT";
  const lowBoth = a.income==="Under $3,000" && a.budget==="$300 – $500";
  if(lowBoth) return "NURTURE";
  return "WARM";
}

function finish(){
  track("complete");
  const tier = scoreLead(answers);
  const parts = (answers.name||"").trim().split(/\s+/);
  const firstName_ = parts[0]||"";
  const lastName_  = parts.slice(1).join(" ")||"";
  const eventId = "ev_"+Date.now()+"_"+Math.random().toString(36).slice(2,10); // dedup key
  const nowIso  = new Date().toISOString();

  const payload = {
    // --- Standard contact ---
    first_name: firstName_,
    last_name:  lastName_,
    full_name:  answers.name,
    phone:      answers.phone,
    email:      answers.email,
    state:      answers.state,

    // --- Quiz answers (full record, kept verbatim) ---
    quiz_trade:                answers.trade,
    quiz_iul_interest:         answers.iul_interest,
    quiz_age:                  answers.age,
    quiz_household_income:     answers.income,
    quiz_monthly_contribution: answers.budget,
    quiz_lead_tier:            tier,

    // --- TCPA consent proof ---
    consent_given:     "Yes",
    consent_timestamp: nowIso,
    consent_language:  CONSENT_TEXT,
    consent_ip:        leadIp,

    // --- Meta attribution + CAPI dedup ---
    event_name:   META_EVENT,
    event_id:     eventId,
    fbc:          tracking.fbc,
    fbp:          tracking.fbp,
    fbclid:       tracking.fbclid,
    utm_source:   tracking.utm_source,
    utm_campaign: tracking.utm_campaign,
    utm_content:  tracking.utm_content,
    landing_url:  tracking.landing_url,

    lead_source:  "early-retirement-quiz",
    submitted_at: nowIso
  };

  // --- Canonical fields mapped by the Advertisely inbound endpoint (additive;
  //     everything above is preserved in the lead's raw form data) ---
  payload.name        = answers.name;
  payload.occupation  = answers.trade;
  payload.age         = answers.age;
  payload.intent      = answers.iul_interest;
  payload.source      = "early-retirement-quiz";
  payload.external_id = eventId;

  // Browser pixel event — deduped against any server CAPI event via eventID
  if(window.fbq){ try{ fbq('track', META_EVENT, { lead_tier:tier }, { eventID:eventId }); }catch(e){} }

  // Send to Advertisely (creates the lead + drops it into fulfillment)
  if(WEBHOOK_URL){
    fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(()=>{});
  }
  console.log("LEAD PAYLOAD →", payload);

  paintProgress(); [...track.children].forEach(s=>s.classList.add('done'));
  const tierLine = tier==="HOT" ? "You're a strong fit — expect a call shortly."
                 : tier==="NURTURE" ? "We'll send you a plan and check in."
                 : "A specialist will reach out to walk you through it.";
  stage.replaceChildren();
  const d=document.createElement('div'); d.className='done-screen';
  d.innerHTML=`
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>
    <h2>You're in, ${escapeHtml(firstName(answers.name))}</h2>
    <p>${tierLine} Keep an eye on your phone and email — we move fast.</p>
    <div class="tag">Lead tier: ${tier}</div>`;
  stage.appendChild(d);
  window.scrollTo({top:0,behavior:'smooth'});
}
function firstName(n){ return (n||"").trim().split(/\s+/)[0]||"friend"; }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

render();
</script>
</body>
</html>
